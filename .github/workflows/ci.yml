name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '24'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: sodium, sqlite3, pdo_sqlite
          coverage: xdebug

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      # The security-header tests assert against real Vite output, so the
      # manifest has to exist before the suite runs.
      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests
        run: php artisan test --coverage

  # The suite again, against the database production actually runs (Phase 12,
  # task 1). SQLite is fine for behaviour and blind to the thing that matters
  # here: three columns hold bytes somebody signed, and on SQLite a column type
  # is close to a comment, so `json` and `jsonb` behave identically. On Postgres
  # `jsonb` reorders keys, normalises whitespace and drops duplicates — each of
  # which turns a valid signature into one that looks like tampering.
  #
  # Its own job rather than a matrix on `backend`, because the analysis, the
  # formatting check and the asset build have nothing to do with the database
  # and running them twice buys nothing.
  postgres:
    name: Backend (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vault_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: vault_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: sodium, pgsql, pdo_pgsql
          coverage: none

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests
        run: php artisan test

      # Everything above connects as the owner, which is correct for a test
      # database and is not how production connects. This proves the grant that
      # makes `audit_events` append-only at the database level is actually
      # applicable to the schema the migrations produce — the layer that a
      # future code change cannot undo, and the one nothing else can check.
      - name: The audit log refuses UPDATE and DELETE to an unprivileged role
        run: |
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -U postgres -d vault_test -v ON_ERROR_STOP=1 <<'SQL'
            CREATE ROLE vault_app LOGIN PASSWORD 'vault_app';
            GRANT USAGE ON SCHEMA public TO vault_app;
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO vault_app;
            GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO vault_app;
            REVOKE UPDATE, DELETE ON audit_events FROM vault_app;
          SQL

          # An INSERT must still work — a log that cannot be appended to is not
          # a log, and revoking too much is as wrong as revoking too little.
          PGPASSWORD=vault_app psql -h 127.0.0.1 -U vault_app -d vault_test -v ON_ERROR_STOP=1 -c \
            "INSERT INTO audit_events (seq, prev_hash, hash, action, metadata, created_at)
             VALUES (1, repeat('0', 64), repeat('1', 64), 'auth.logged_in', '{}', now());"

          # An UPDATE and a DELETE must both be refused by the database itself,
          # not by the model. `!` inverts the exit status: these must fail.
          ! PGPASSWORD=vault_app psql -h 127.0.0.1 -U vault_app -d vault_test -v ON_ERROR_STOP=1 -c \
            "UPDATE audit_events SET action = 'auth.logged_out' WHERE seq = 1;"

          ! PGPASSWORD=vault_app psql -h 127.0.0.1 -U vault_app -d vault_test -v ON_ERROR_STOP=1 -c \
            "DELETE FROM audit_events WHERE seq = 1;"

          # And the revoke must be scoped to that one table. An over-broad grant
          # would leave the application unable to edit a secret, which is the
          # failure mode of getting this right in the wrong direction.
          psql -h 127.0.0.1 -U postgres -d vault_test -v ON_ERROR_STOP=1 -t -c \
            "SELECT CASE WHEN has_table_privilege('vault_app', 'vaults', 'UPDATE')
                          AND has_table_privilege('vault_app', 'secrets', 'DELETE')
                    THEN 'ok' ELSE 'over-broad revoke' END;" | grep -q ok

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run types

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Enforces the 100% threshold on resources/js/crypto once Phase 1 lands.
      - name: Tests
        run: npm run test:coverage

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: sodium, sqlite3, pdo_sqlite

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Audit PHP dependencies
        run: composer audit

      - name: Audit JS dependencies
        run: npm audit --audit-level=moderate

      # SR2: no key capable of decrypting user content may exist on the server,
      # so no server-side decryption path may exist either. See
      # docs/02-threat-model.md.
      #
      # Run as its own job as well as inside the backend suite, so a failure of
      # the single most important rule here is unmissable rather than one line
      # in a list of two hundred.
      #
      # This used to be a `grep` for the word "decrypt". It could not tell a
      # call from a comment, so `Ciphertext`'s docblock — which says it
      # deliberately has no decrypt() method — tripped the gate that docblock
      # exists to explain. The Pest test tokenises the PHP and strips comments
      # first, which is the only way to get that right, and it also asserts
      # that the pattern would still fire if a real call were added.
      - name: Assert no server-side decryption
        run: php artisan test --compact tests/Feature/NoServerDecryptionTest.php

  # A running instance, scanned from the outside (Phase 11, task 9).
  #
  # Its own job because it is the only one here that needs the application
  # actually serving traffic, and because it fails differently from the rest:
  # everything else asserts something we decided, and this reports what a
  # scanner finds without being told what to look for.
  #
  # It reaches the unauthenticated surface only — sign-in, recovery, the
  # disclosure page, a share link. That is the surface a stranger has, which is
  # the surface worth scanning without credentials; the authorisation model
  # behind it is covered by tests/Feature/Vault/AuthorisationTest.php, which can
  # assert things a spider cannot infer.
  #
  # Findings are triaged in .zap/rules.tsv, one line each with its reason.
  zap:
    name: Baseline scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: sodium, sqlite3, pdo_sqlite

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci --ignore-scripts

      # The real bundle, because the headers under scan are built around it:
      # the nonce has to authorise a script tag that exists, and the integrity
      # attributes come from the manifest.
      - name: Build assets
        run: npm run build

      - name: Serve the application
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
          php artisan serve --port=8000 &
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:8000/up > /dev/null; do sleep 1; done'

      - name: ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://127.0.0.1:8000
          rules_file_name: .zap/rules.tsv
          # Report warnings without failing on them; a FAIL-level rule still
          # fails the job. Warnings that survive a look belong in the rules
          # file with a reason, not in a job that everybody learns to ignore.
          fail_action: false
          allow_issue_writing: false
